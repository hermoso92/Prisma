[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prisma-context"
version = "0.0.1"
description = "Prisma — tu cerebro de contexto personal: base de conocimiento multimodal de tu mundo digital."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prisma" }]
# Fase 0: solo biblioteca estándar. Las dependencias de análisis multimodal,
# embeddings y MCP se añadirán como extras en las fases correspondientes.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# Extras locales y gratuitos para la "magia" (todos opcionales; el CLI degrada
# con elegancia si faltan). Instálalos en tu Mac según lo que quieras usar.
vision = ["ultralytics"]            # detección de personas/animales (YOLO)
faces = ["face_recognition"]        # reconocimiento facial ("solo yo")
render = ["pillow"]                 # collage (el vídeo usa el binario ffmpeg)

[project.scripts]
prisma = "prisma.cli:main"

[tool.setuptools.packages.find]
include = ["prisma*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
